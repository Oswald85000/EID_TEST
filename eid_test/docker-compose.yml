version: "3.8"

services:
  eid:
    build: .
    container_name: eid
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: prom
    volumes:
      - ./prom.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: graf
    ports:
      - "3000:3000"
